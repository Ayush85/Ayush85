name: game
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: profile-data
  cancel-in-progress: false
jobs:
  play:
    if: startsWith(github.event.issue.title, '[game]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take turn
        run: python3 scripts/game.py
        env:
          REPLY_FILE: ${{ runner.temp }}/reply.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game.json assets/game.svg
          git diff --cached --quiet || git commit -m "Game turn"
          git pull --rebase -q
          git push
      - name: Reply and close
        run: gh issue close "$NUMBER" --comment "$(cat "$RUNNER_TEMP/reply.txt")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
