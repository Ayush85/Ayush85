<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<title>Terminal: projects status</title>
<style>
.l{opacity:0;animation:in .01s forwards}
@keyframes in{to{opacity:1}}
.k{fill:#38f2c8}.d{fill:#6f86b3}.w{fill:#d7e5ff}.ok{fill:#38f2c8;font-weight:700}
.cur{fill:#38f2c8;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
</style>
<defs><clipPath id="tc"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="154" dur="1.4s" begin="0.6s" fill="freeze" calcMode="discrete" values="0;8;16;24;32;40;49;57;65;73;81;89;97;105;113;122;130;138;146;154"/></rect></clipPath></defs>
<rect width="900" height="260" rx="12" fill="#04070d"/><rect x=".5" y=".5" width="899" height="259" rx="12" fill="none" stroke="#1d2f55"/>
<circle cx="22" cy="20" r="5" fill="#ff5f57"/><circle cx="40" cy="20" r="5" fill="#febc2e"/><circle cx="58" cy="20" r="5" fill="#28c840"/>
<text x="450.0" y="24" text-anchor="middle" class="d" font-size="11">ayush@node-01: ~</text>
<text x="24" y="62"><tspan class="k">ayush@node-01</tspan><tspan class="d">:~$</tspan></text>
<g transform="translate(162,0)"><g clip-path="url(#tc)"><text x="0" y="62" class="w">./projects --status</text></g></g>
<g class="l" style="animation-delay:2.20s"><text x="24" y="92" xml:space="preserve"><tspan class="w">egg-farm    </tspan><tspan class="d">[ </tspan><tspan class="ok">UP</tspan><tspan class="d"> ]</tspan><tspan class="d">  egg-farm.aydexis.com</tspan></text></g>
<g class="l" style="animation-delay:2.55s"><text x="24" y="116" xml:space="preserve"><tspan class="w">menuor      </tspan><tspan class="d">[ </tspan><tspan class="ok">UP</tspan><tspan class="d"> ]</tspan><tspan class="d">  multi-tenant menus · auto-TLS per domain</tspan></text></g>
<g class="l" style="animation-delay:2.90s"><text x="24" y="140" xml:space="preserve"><tspan class="w">aydexCloud  </tspan><tspan class="d">[ </tspan><tspan class="ok">UP</tspan><tspan class="d"> ]</tspan><tspan class="d">  go tracker · next.js dashboard</tspan></text></g>
<g class="l" style="animation-delay:3.25s"><text x="24" y="164" xml:space="preserve"><tspan class="w">futsal      </tspan><tspan class="d">[ </tspan><tspan class="ok">UP</tspan><tspan class="d"> ]</tspan><tspan class="d">  role-based court booking</tspan></text></g>
<g class="l" style="animation-delay:3.60s"><text x="24" y="188" xml:space="preserve"><tspan class="w">fintrack    </tspan><tspan class="d">[ </tspan><tspan class="ok">UP</tspan><tspan class="d"> ]</tspan><tspan class="d">  SMS → categorized spend</tspan></text></g>
<g class="l" style="animation-delay:4.25s"><text x="24" y="220" class="d">5 services up · 0 degraded · last deploy: today</text></g>
<g class="l" style="animation-delay:4.75s"><text x="24" y="250"><tspan class="k">ayush@node-01</tspan><tspan class="d">:~$ </tspan></text><rect class="cur" x="162" y="238" width="8" height="15"/></g>
</svg>